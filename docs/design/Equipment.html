<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Gym profile: home gym equipment</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Geist',system-ui,sans-serif;color:#0E1116;-webkit-font-smoothing:antialiased}
a{color:#2445D8}a:hover{color:#1A33A8}
.card{background:#FFFFFF;border:1px solid #E3E6EB;border-radius:16px}
.label{font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#4A5260;margin:0}
.muted{color:#4A5260}
.num{font-variant-numeric:tabular-nums}
.btn{font:inherit;font-weight:600;font-size:16px;min-height:48px;border-radius:12px;border:0;padding:0 20px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn-p{background:#2445D8;color:#FFFFFF}
.btn-p:hover{background:#1A33A8;color:#FFFFFF}
.btn-s{background:#FFFFFF;color:#0E1116;border:1px solid #CBD0D8}
.icon-btn{font:inherit;width:44px;height:44px;border-radius:12px;border:0;background:transparent;color:#0E1116;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.chip{font:inherit;font-size:14px;font-weight:500;min-height:44px;padding:0 16px;border-radius:999px;border:1px solid #CBD0D8;background:#FFFFFF;color:#0E1116;display:inline-flex;align-items:center;gap:8px;cursor:pointer}
.chip-on{background:#E8EDFF;border-color:#2445D8;color:#1A33A8}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-width:64px;min-height:48px;font-size:12px;font-weight:500;color:#5B6372;text-decoration:none}
.tab:hover{color:#0E1116}
.tab-on{color:#2445D8;font-weight:600}
.tab-on:hover{color:#2445D8}
.opt{display:flex;align-items:center;gap:14px;padding:14px 16px;border:1px solid #E3E6EB;border-radius:14px;background:#FFFFFF;cursor:pointer}
.opt-on{border:2px solid #2445D8;padding:13px 15px;background:#F7F9FF}
.opt input{width:22px;height:22px;margin:0;accent-color:#2445D8;flex-shrink:0}
svg{flex-shrink:0}
.side{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 12px;border-radius:10px;color:#0E1116;text-decoration:none;font-size:15px;font-weight:500}
.side:hover{background:#F1F3F6;color:#0E1116}
.side-on{background:#E8EDFF;color:#1A33A8;font-weight:600}
.side-on:hover{background:#E8EDFF;color:#1A33A8}
</style>
<style>body{background:#E9ECF0;display:flex;justify-content:center;padding:24px}</style>
</head>
<body>


<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F6F7F9; display: flex; flex-direction: column">
  <header style="padding: 52px 16px 8px; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <a href="OnboardGyms.html" class="icon-btn" aria-label="Back"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg></a>
      <h1 style="margin: 0; font-size: 17px; font-weight: 600">Gym profiles</h1>
      <span style="width: 44px"></span>
    </div>
    <div role="tablist" aria-label="Gym profiles" style="display: flex; gap: 8px; padding: 0 4px">
      <button role="tab" aria-selected="true" class="chip chip-on" type="button" style="font-weight: 600">Home gym</button>
      <button role="tab" aria-selected="false" class="chip" type="button">Commercial</button>
      <button class="chip" type="button" aria-label="Add gym profile" style="padding: 0 14px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Add</button>
    </div>
    <label style="display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 14px; margin: 0 4px; background: #FFFFFF; border: 1px solid #CBD0D8; border-radius: 12px">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4A5260" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
      <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search equipment</span>
      <input placeholder="Search 140+ items" style="font: inherit; font-size: 16px; border: 0; outline: none; flex-grow: 1; background: transparent; color: #0E1116">
    </label>
  </header>

  <main style="flex-grow: 1; overflow: hidden; padding: 4px 20px 0; display: flex; flex-direction: column; gap: 14px">
    <section style="display: flex; flex-direction: column; gap: 8px">
      <h2 class="label">Free weights</h2>
      <div class="card" style="display: flex; flex-direction: column">
        <label style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; min-height: 48px; border-bottom: 1px solid #E3E6EB">
          <input type="checkbox" checked="" style="width: 22px; height: 22px; margin: 0; accent-color: #2445D8">
          <span style="flex-grow: 1; display: flex; flex-direction: column"><b style="font-size: 15px; font-weight: 600">Adjustable dumbbells</b><span class="muted num" style="font-size: 13px">2 – 32 kg · 2 kg steps</span></span>
          <a href="#" style="font-size: 14px; font-weight: 600; padding: 12px 4px; text-decoration: none">Edit</a>
        </label>
        <label style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; min-height: 48px">
          <input type="checkbox" checked="" style="width: 22px; height: 22px; margin: 0; accent-color: #2445D8">
          <span style="flex-grow: 1; display: flex; flex-direction: column"><b style="font-size: 15px; font-weight: 600">Olympic barbell + plates</b><span class="muted num" style="font-size: 13px">20 kg bar · up to 140 kg</span></span>
          <a href="#" style="font-size: 14px; font-weight: 600; padding: 12px 4px; text-decoration: none">Edit</a>
        </label>
        
      </div>
    </section>

    <section style="display: flex; flex-direction: column; gap: 8px">
      <h2 class="label">Racks, benches &amp; bars</h2>
      <div class="card" style="display: flex; flex-direction: column">
        <label style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; min-height: 48px; border-bottom: 1px solid #E3E6EB">
          <input type="checkbox" checked="" style="width: 22px; height: 22px; margin: 0; accent-color: #2445D8">
          <b style="flex-grow: 1; font-size: 15px; font-weight: 600">Squat rack with safeties</b>
        </label>
        <label style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; min-height: 48px">
          <input type="checkbox" checked="" style="width: 22px; height: 22px; margin: 0; accent-color: #2445D8">
          <b style="flex-grow: 1; font-size: 15px; font-weight: 600">Adjustable bench</b>
        </label>
        
      </div>
    </section>

    <section style="display: flex; flex-direction: column; gap: 8px">
      <h2 class="label">Your custom kit</h2>
      <div class="card" style="padding: 14px; display: flex; flex-direction: column; gap: 10px">
        <div style="display: flex; justify-content: space-between; align-items: center">
          <b style="font-size: 15px; font-weight: 600">Landmine attachment</b>
          <a href="#" style="font-size: 14px; font-weight: 600; padding: 12px 4px; text-decoration: none">Edit</a>
        </div>
        <div style="display: flex; gap: 6px; flex-wrap: wrap; align-items: center">
          <span class="muted" style="font-size: 13px">Counts as</span>
          <span style="font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: #E8EDFF; color: #1A33A8">Landmine</span>
          <span style="font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: #E8EDFF; color: #1A33A8">Barbell</span>
        </div>
      </div>
      <button type="button" class="btn btn-s" style="width: 100%"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Add custom equipment</button>
    </section>
  </main>

  <footer style="padding: 12px 20px 34px; background: #F6F7F9; border-top: 1px solid #E3E6EB">
    <a href="Today.html" class="btn btn-p" style="width: 100%; box-sizing: border-box">Save home gym · 5 items</a>
  </footer>
</div>
</body>
</html>
