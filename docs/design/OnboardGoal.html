<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Onboarding: goal</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Geist',system-ui,sans-serif;color:#0E1116;-webkit-font-smoothing:antialiased}
a{color:#2445D8}a:hover{color:#1A33A8}
.card{background:#FFFFFF;border:1px solid #E3E6EB;border-radius:16px}
.label{font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#4A5260;margin:0}
.muted{color:#4A5260}
.num{font-variant-numeric:tabular-nums}
.btn{font:inherit;font-weight:600;font-size:16px;min-height:48px;border-radius:12px;border:0;padding:0 20px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn-p{background:#2445D8;color:#FFFFFF}
.btn-p:hover{background:#1A33A8;color:#FFFFFF}
.btn-s{background:#FFFFFF;color:#0E1116;border:1px solid #CBD0D8}
.icon-btn{font:inherit;width:44px;height:44px;border-radius:12px;border:0;background:transparent;color:#0E1116;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.chip{font:inherit;font-size:14px;font-weight:500;min-height:44px;padding:0 16px;border-radius:999px;border:1px solid #CBD0D8;background:#FFFFFF;color:#0E1116;display:inline-flex;align-items:center;gap:8px;cursor:pointer}
.chip-on{background:#E8EDFF;border-color:#2445D8;color:#1A33A8}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-width:64px;min-height:48px;font-size:12px;font-weight:500;color:#5B6372;text-decoration:none}
.tab:hover{color:#0E1116}
.tab-on{color:#2445D8;font-weight:600}
.tab-on:hover{color:#2445D8}
.opt{display:flex;align-items:center;gap:14px;padding:14px 16px;border:1px solid #E3E6EB;border-radius:14px;background:#FFFFFF;cursor:pointer}
.opt-on{border:2px solid #2445D8;padding:13px 15px;background:#F7F9FF}
.opt input{width:22px;height:22px;margin:0;accent-color:#2445D8;flex-shrink:0}
svg{flex-shrink:0}
.side{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 12px;border-radius:10px;color:#0E1116;text-decoration:none;font-size:15px;font-weight:500}
.side:hover{background:#F1F3F6;color:#0E1116}
.side-on{background:#E8EDFF;color:#1A33A8;font-weight:600}
.side-on:hover{background:#E8EDFF;color:#1A33A8}
</style>
<style>body{background:#E9ECF0;display:flex;justify-content:center;padding:24px}</style>
</head>
<body>


<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F6F7F9; display: flex; flex-direction: column">
  <header style="display: flex; align-items: center; gap: 8px; padding: 52px 16px 8px">
    <a href="#" class="icon-btn" aria-label="Back"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg></a>
    <div role="progressbar" aria-label="Setup progress" aria-valuemin="1" aria-valuemax="6" aria-valuenow="2" style="flex-grow: 1; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 4px; padding-right: 12px">
      <span style="height: 4px; border-radius: 2px; background: #2445D8"></span>
      <span style="height: 4px; border-radius: 2px; background: #2445D8"></span>
      <span style="height: 4px; border-radius: 2px; background: #D5D9E0"></span>
      <span style="height: 4px; border-radius: 2px; background: #D5D9E0"></span>
      <span style="height: 4px; border-radius: 2px; background: #D5D9E0"></span>
      <span style="height: 4px; border-radius: 2px; background: #D5D9E0"></span>
    </div>
  </header>

  <main style="flex-grow: 1; padding: 12px 20px 0; display: flex; flex-direction: column; gap: 20px">
    <div style="display: flex; flex-direction: column; gap: 8px">
      <p class="label">Step 2 of 6 · Goal</p>
      <h1 style="margin: 0; font-size: 28px; line-height: 34px; font-weight: 700; letter-spacing: -0.01em">What's your main goal?</h1>
      <p class="muted" style="margin: 0; font-size: 15px; line-height: 22px">This sets your calorie and protein targets and shapes your training. You can change it any time.</p>
    </div>

    <fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px">
      <legend style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Main goal</legend>
      <label class="opt"><input type="radio" name="goal" value="fat"><span style="display: flex; flex-direction: column; gap: 2px"><b style="font-size: 16px; font-weight: 600">Lose fat</b><span class="muted" style="font-size: 14px">Calorie deficit, keep your muscle</span></span></label>
      <label class="opt opt-on"><input type="radio" name="goal" value="muscle" checked=""><span style="display: flex; flex-direction: column; gap: 2px"><b style="font-size: 16px; font-weight: 600">Build muscle</b><span class="muted" style="font-size: 14px">Small surplus, hypertrophy focus</span></span></label>
      <label class="opt"><input type="radio" name="goal" value="strength"><span style="display: flex; flex-direction: column; gap: 2px"><b style="font-size: 16px; font-weight: 600">Get stronger</b><span class="muted" style="font-size: 14px">Heavy compound lifts, lower reps</span></span></label>
      <label class="opt"><input type="radio" name="goal" value="recomp"><span style="display: flex; flex-direction: column; gap: 2px"><b style="font-size: 16px; font-weight: 600">Recomposition</b><span class="muted" style="font-size: 14px">Lose fat and build muscle, slowly</span></span></label>
      <label class="opt"><input type="radio" name="goal" value="health"><span style="display: flex; flex-direction: column; gap: 2px"><b style="font-size: 16px; font-weight: 600">Health &amp; fitness</b><span class="muted" style="font-size: 14px">Feel better, move well, build a habit</span></span></label>
    </fieldset>

    <fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px">
      <legend style="font-size: 16px; font-weight: 600; padding: 0; margin-bottom: 10px">Training days per week</legend>
      <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px">
        <button type="button" class="chip" aria-pressed="false" style="justify-content: center; border-radius: 12px">2</button>
        <button type="button" class="chip" aria-pressed="false" style="justify-content: center; border-radius: 12px">3</button>
        <button type="button" class="chip chip-on" aria-pressed="true" style="justify-content: center; border-radius: 12px; font-weight: 600">4</button>
        <button type="button" class="chip" aria-pressed="false" style="justify-content: center; border-radius: 12px">5</button>
        <button type="button" class="chip" aria-pressed="false" style="justify-content: center; border-radius: 12px">6</button>
      </div>
    </fieldset>
  </main>

  <footer style="padding: 16px 20px 34px">
    <a href="OnboardGyms.html" class="btn btn-p" style="width: 100%; box-sizing: border-box">Continue</a>
  </footer>
</div>
</body>
</html>
