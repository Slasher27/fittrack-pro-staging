name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Lint, typecheck, unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm check
      - run: pnpm test

  db-e2e:
    name: RLS (pgTAP) and e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start local Supabase
        run: pnpm supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor
      - name: RLS tests
        run: pnpm supabase test db
      - name: Generated types are up to date
        run: |
          pnpm db:types
          git diff --exit-code src/lib/supabase/types.ts
      - name: App env from local Supabase
        run: |
          pnpm --silent supabase status -o env > .supabase.env
          . ./.supabase.env
          echo "PUBLIC_SUPABASE_URL=$API_URL" >> .env
          echo "PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY" >> .env
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
